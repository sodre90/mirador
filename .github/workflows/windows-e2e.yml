name: Windows e2e

on:
  push:
    branches: [windows-e2e]
  # Some specs run many times, to tell a fixed flake from a lucky run; without them, the whole suite runs once.
  workflow_dispatch:
    inputs:
      specs:
        description: Spec files, separated by spaces
        required: false
      repeat:
        default: "1"
  # make release calls this, so a spec failing with no stated reason holds the release.
  workflow_call:
    inputs:
      commit:
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Runs the whole suite as it stands on Windows, a third on each of three runners at once, and reports which specs pass
  # and fail, and how long it all takes. A shard is red only for its own specs, so gh run rerun --failed runs just that one.
  shard:
    strategy:
      fail-fast: false
      matrix:
        # The survey job joins as many reports as there are shards here.
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SURVEY: survey-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium webkit
      - name: Install Claude Code
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # The version the Mac and the Linux image run. npm puts an opencode.cmd on PATH, as it does for users who install it so.
      - name: Install opencode
        shell: pwsh
        run: |
          npm install --global @opencode/cli@2.0.27
          npm prefix --global | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & (Join-Path (npm prefix --global) "opencode.cmd") --version
      # A test host waits for the processes it started and kills those that outlive it. Windows keeps a parent pid after
      # that parent exits and gives the pid to later processes: these are the runner's processes a host could take for its own.
      - name: Processes with a stale parent
        shell: pwsh
        run: |
          $processes = bun e2e/windows-process-list.ts | ConvertFrom-Json
          $byPid = @{}; $processes | ForEach-Object { $byPid[[int]$_.pid] = $_ }
          $isStale = { param($process) $process.parentPid -ne 0 -and (-not $byPid.ContainsKey([int]$process.parentPid) -or $byPid[[int]$process.parentPid].startedAt -gt $process.startedAt) }
          "Processes whose parent pid is gone or belongs to a later process:"
          $processes | Where-Object { & $isStale $_ } | ForEach-Object { "  $($_.name) $($_.pid), parent pid $($_.parentPid)" }
          "This step's ancestors:"
          $current = $byPid[[int]$PID]
          while ($current) {
            "  $($current.name) $($current.pid)$(if (& $isStale $current) { ', parent pid stale' })"
            $current = if (& $isStale $current) { $null } else { $byPid[[int]$current.parentPid] }
          }
      # As in the unit tests: Git for Windows puts only its cmd folder on PATH, so a user's Windows has no sh, sleep or
      # openssl there; the runner's PATH has them, from Git's other folders and from OpenSSL.
      # Specs that wait for a real reply get it from the owner's model server, on the "haiku" the test hosts choose. The
      # server doesn't serve tool search's tool_reference blocks, and Haiku has Claude Code load MCP tools upfront anyway.
      - name: Run the suite
        shell: pwsh
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LLM_SERVER_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_SERVER_KEY }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: radiance-qwen3.8-flash-next
          ANTHROPIC_DEFAULT_SONNET_MODEL: radiance-qwen3.8-flash-next
          ANTHROPIC_DEFAULT_OPUS_MODEL: radiance-qwen3.8-flash-next
          ANTHROPIC_SMALL_FAST_MODEL: radiance-qwen3.8-flash-next
          ENABLE_TOOL_SEARCH: "false"
          SPECS: ${{ inputs.specs }}
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          $serverHost = ($env:ANTHROPIC_BASE_URL -as [uri]).Host
          if ($serverHost) { "::add-mask::$serverHost" }
          $modelServer = @($env:ANTHROPIC_AUTH_TOKEN, $env:ANTHROPIC_BASE_URL, $serverHost) | Where-Object { $_ }
          filter Hide-ModelServer { $text = $_; foreach ($secret in $modelServer) { $text = $text.Replace($secret, "REDACTED") }; $text }
          $unixTools = "sh.exe", "sleep.exe", "openssl.exe"
          $env:Path = ($env:Path -split ";" | Where-Object { $folder = $_; $folder -and -not ($unixTools | Where-Object { Test-Path -LiteralPath (Join-Path $folder $_) }) }) -join ";"
          "::group::What the specs run with"
          where.exe git bun node pwsh powershell bash claude opencode
          claude --version
          "::endgroup::"
          $env:PLAYWRIGHT_JSON_OUTPUT_NAME = $env:SURVEY
          $env:MIRADOR_E2E_KEEP = "1"
          $started = Get-Date
          # A loaded runner makes some specs fail once and pass when tried again. One try again tells those apart from a spec that
          # fails every time: the Verdict lists a spec that passed on its retry, but only a spec that fails twice holds the release.
          # A release asks for two tries again, so a spec that is only flaky on the shared runner (vcs-pgm.49) has to miss three
          # times before it holds one. The ten specs with a stated reason gain a try too, about six minutes on a 36-minute suite.
          # The 75-minute suite budget stays inside the job's 120 even after a slow setup, so an overrun ends as a reported
          # interrupted suite rather than a cancelled job whose JSON reporter wrote nothing for the Verdict to read.
          # Only a release passes a commit. A called workflow's github.event_name is its caller's, never workflow_call.
          cmd /c "bunx playwright test $env:SPECS --repeat-each=$env:REPEAT --pass-with-no-tests --shard=${{ matrix.shard }}/${{ strategy.job-total }} --global-timeout=4500000 --retries=${{ inputs.commit && 2 || 1 }} --reporter=list,json > survey-output.txt 2>&1"
          "playwright exit: $LASTEXITCODE, minutes: $([math]::Round(((Get-Date) - $started).TotalMinutes, 1))"
          Get-Content survey-output.txt | Where-Object { $_ -notmatch 'auth\?(token|code)' }
          if (Test-Path $env:SURVEY) { (Get-Content -Raw $env:SURVEY) -replace 'auth\?(token|code)=[^"\s\\&]*', 'auth?$1=REDACTED' | Hide-ModelServer | Set-Content $env:SURVEY }
          # GitHub's pwsh wrapper would end the step with Playwright's exit code, failing a release on a known issue; the Verdict gates.
          exit 0
      # The gate: a spec that fails other than as e2e/windows-known-issues.json states, or a suite cut short, turns this job
      # red, and with it any release that waits for it.
      - name: Verdict
        if: always()
        shell: bash
        run: bun e2e/windows-suite-verdict.ts "$SURVEY" e2e/windows-known-issues.json
      # Traces and the kept host folders are left out: they hold the sign-in link, browser tokens and databases. Only their
      # logs go, and each failed test's page as error-context.md writes it, with auth links and the model server's address
      # and key taken out.
      - name: Collect host logs and failed tests' pages
        if: always()
        shell: pwsh
        env:
          LLM_SERVER_URL: ${{ secrets.LLM_SERVER_URL }}
          LLM_SERVER_KEY: ${{ secrets.LLM_SERVER_KEY }}
        run: |
          $modelServer = @($env:LLM_SERVER_KEY, $env:LLM_SERVER_URL, ($env:LLM_SERVER_URL -as [uri]).Host) | Where-Object { $_ }
          filter Hide-ModelServer { $text = $_; foreach ($secret in $modelServer) { $text = $text.Replace($secret, "REDACTED") }; $text }
          New-Item -ItemType Directory -Force e2e-logs | Out-Null
          Get-ChildItem -Path $env:TEMP -Directory -Filter "mirador-e2e-*" | ForEach-Object {
            $hostDir = $_
            $logs = @(Get-Item -LiteralPath (Join-Path $hostDir.FullName "host.log") -ErrorAction SilentlyContinue) + @(Get-ChildItem -Path (Join-Path $hostDir.FullName "data\logs") -File -Filter *.log -ErrorAction SilentlyContinue)
            $logs | ForEach-Object {
              $target = Join-Path e2e-logs ($hostDir.Name + "-" + $_.Name)
              Get-Content -LiteralPath $_.FullName | Where-Object { $_ -notmatch 'auth\?(token|code)' } | Hide-ModelServer | Set-Content -LiteralPath $target
            }
          }
          New-Item -ItemType Directory -Force e2e-pages | Out-Null
          Get-ChildItem -Path test-results -Recurse -File -Filter error-context.md -ErrorAction SilentlyContinue | ForEach-Object {
            $target = Join-Path e2e-pages ($_.Directory.Name + ".md")
            Get-Content -LiteralPath $_.FullName | Where-Object { $_ -notmatch 'auth\?(token|code)' } | Hide-ModelServer | Set-Content -LiteralPath $target
          }
          Get-ChildItem -Path test-results -Recurse -File -Filter app-trace.txt -ErrorAction SilentlyContinue | ForEach-Object {
            $target = Join-Path e2e-pages ($_.Directory.Name + "-app-trace.txt")
            Get-Content -LiteralPath $_.FullName | Where-Object { $_ -notmatch 'auth\?(token|code)' } | Hide-ModelServer | Set-Content -LiteralPath $target
          }
      # A shard run again replaces the artifact its earlier try left.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-shard-${{ matrix.shard }}
          path: |
            ${{ env.SURVEY }}
            e2e-logs/
            e2e-pages/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
  # The shards' reports joined into the one survey.json a single run would have written, judged as a whole, with every
  # shard's logs and pages beside it. A shard that is not run again keeps the artifact of its earlier try.
  survey:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-e2e-shard-*
          merge-multiple: true
      # As many as the shard job's matrix has.
      - name: Join the shards' reports
        run: bun e2e/windows-survey-merge.ts 3 survey.json
      - name: Verdict
        if: always()
        run: bun e2e/windows-suite-verdict.ts survey.json e2e/windows-known-issues.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-survey
          path: |
            survey.json
            e2e-logs/
            e2e-pages/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      # The survey of each try stays too, so a red try's report outlives a rerun that passes.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-survey-attempt-${{ github.run_attempt }}
          path: |
            survey.json
            e2e-logs/
            e2e-pages/
          retention-days: 7
          if-no-files-found: ignore
