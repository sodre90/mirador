name: Windows release

# make release starts this for the release's commit and waits for the whole run, so a job added here holds the release.
# Going on from its windows step after a red run runs only the failed jobs again (gh run rerun --failed).
run-name: Windows release of ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build
        required: true

permissions:
  contents: read

jobs:
  # The gate vcs-pgm.14 asks for: every spec passes, or fails for a reason stated in e2e/windows-known-issues.json.
  # Needs the owner's model server up, since the specs that wait for a real reply wait for it.
  e2e:
    uses: ./.github/workflows/windows-e2e.yml
    with:
      commit: ${{ inputs.commit }}
    secrets: inherit
  build:
    # Electrobun does not cross-compile, so the Windows app is built on Windows.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - working-directory: desktop
        run: bun install --frozen-lockfile
      - working-directory: desktop
        run: bun run build:release
      - name: Name the files as the release does
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-files | Out-Null
          Copy-Item desktop/artifacts/win-x64-Mirador-Setup.zip release-files/Mirador-windows-x64-Setup.zip
          Copy-Item desktop/artifacts/stable-win-x64-update.json, desktop/artifacts/stable-win-x64-Mirador.tar.zst release-files/
      - uses: actions/upload-artifact@v7
        with:
          name: mirador-windows-x64
          path: release-files/
          if-no-files-found: error
